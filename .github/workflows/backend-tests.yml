name: Backend Unit Tests

on:
  pull_request:
    branches: [develop]
  workflow_run:
    workflows: ["Deploy to Render on Develop Push"]
    types:
      - completed

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v3
      with:
        node-version: '18'
    - run: npm install
    - run: npm test