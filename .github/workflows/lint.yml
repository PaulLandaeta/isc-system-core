name: "CI: Lint & Format Checks"

# 1. Se ejecuta en cada PR contra develop (o main)
on:
  pull_request:
    branches: [ develop ]            # Ajusta a tu rama de integración :contentReference[oaicite:0]{index=0}

jobs:
  lint-and-format:
    name: ✔️ Comprobar ESLint & Prettier
    runs-on: ubuntu-latest

    steps:
      # 2. Obtener el código de la PR
      - name: Checkout del código
        uses: actions/checkout@v3        # Clona la PR en el runner :contentReference[oaicite:1]{index=1}

      # 3. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4     # Versión recomendada :contentReference[oaicite:2]{index=2}
        with:
          node-version: '18'             # Ajusta a tu versión de Node :contentReference[oaicite:3]{index=3}

      # 4. Instalación reproducible de dependencias
      - name: Instalar dependencias
        run: npm ci                      # Usa package-lock.json para consistencia :contentReference[oaicite:4]{index=4}

      # 5. Comprobar formateo
      - name: Prettier (modo check)
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,json,css,md}"  
                                        # Falla si hay archivos sin formatear :contentReference[oaicite:5]{index=5}

      # 6. Ejecución de ESLint
      - name: ESLint (sin warnings)
        run: npx eslint "src/**/*.{js,jsx,ts,tsx}" --max-warnings=0  
                                        # Sin advertencias permitidas :contentReference[oaicite:6]{index=6}
