name: Deploy Backend to Vercel

on:
  push:
    branches:
      - develop
      - qa

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    name: Deploy to Development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel - Development
        run: |
          vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }} \
            --scope ${{ secrets.VERCEL_ORG_ID }} \
            --yes \
            --env ENV=development

  deploy-qa-approval:
    if: github.ref == 'refs/heads/develop'
    name: Wait for QA Approval
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: https://your-qa-url.vercel.app
    steps:
      - name: Await manual approval
        run: echo "Esperando aprobación para QA..."

  promote-to-qa:
    name: Merge develop → qa and deploy
    needs: deploy-qa-approval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          ref: qa

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Merge develop into qa
        run: |
          git fetch origin develop
          git merge origin/develop --no-edit
          git push origin qa

  deploy-qa:
    name: Deploy to QA environment
    needs: promote-to-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel - QA
        run: |
          vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }} \
            --scope ${{ secrets.VERCEL_ORG_ID }} \
            --yes \
            --env ENV=qa

            