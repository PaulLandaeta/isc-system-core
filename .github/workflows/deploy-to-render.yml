name: Deploy Backend to Render on Develop Push

permissions:
  contents: write

on:
  workflow_run:
    workflows: ["backend-tests"]
    types:
      - completed

jobs:
  deploy-develop:
    name: Deploy to Render (Develop)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: develop-deploy
    steps:
      - uses: actions/checkout@v3
        with:
          ref: develop
      - name: Trigger develop deploy on Render
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

  deploy-qa:
    name: Deploy to Render (QA)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: deploy-develop
    runs-on: ubuntu-latest
    environment:
      name: qa-deploy
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v3
        with:
          ref: qa
      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
      - name: Merge develop into qa
        run: |
          git fetch origin develop
          git merge origin/develop --no-edit
          git push origin qa
      - name: Trigger QA deploy on Render
        run: curl -X POST ${{ secrets.RENDER_QA_DEPLOY_HOOK_URL }}